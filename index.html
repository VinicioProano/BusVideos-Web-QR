<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BusVideos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 24px;
        background-color: #ffffff;
    }

    h1 {
        font-size: 26px;
        margin-bottom: 6px;
    }

    p {
        font-size: 16px;
        margin-bottom: 24px;
        color: #333;
    }

    /* Normaliza <a> y <button> */
    .btn {
        display: block;
        margin: 16px auto;
        padding: 16px;
        width: 100%;
        max-width: 320px;

        font-size: 18px;
        font-weight: bold;
        text-align: center;

        color: #ffffff;
        background-color: #1a73e8;

        border: none;
        border-radius: 8px;
        text-decoration: none;

        cursor: pointer;

        /* MUY IMPORTANTE */
        appearance: none;
        -webkit-appearance: none;
        box-sizing: border-box;
    }

    .secondary {
        background-color: #4caf50;
    }

    .note {
        font-size: 13px;
        color: #666;
        margin-top: 24px;
        line-height: 1.4;
    }
</style>
</head>
<body>

<script>
    // ===============================
    // VALIDACIÓN DE QR
    // ===============================
    const params = new URLSearchParams(window.location.search);
    const bus = params.get("bus");
    const fromApp = params.get("from") === "app";

    // Si no viene bus, no se muestra nada
    if (!bus) {
        document.body.innerHTML = "";
        return;
    }
</script>

<h1>🎬 BusVideos</h1>

<p id="subtitle">Entretenimiento a bordo</p>

<!-- BOTÓN INSTALAR APP (SIEMPRE VISIBLE, SIN ACCIÓN REAL AÚN) -->
<a class="btn secondary"
   href="https://raw.githubusercontent.com/VinicioProano/BusVideos-Web-QR/master/BusVideos.apk"
   download>
   ⬇ Instalar BusVideos
</a>

<!-- BOTÓN ACTIVAR APP (SIEMPRE VISIBLE) -->
<button id="btnActivar" class="btn" type="button">
    ▶ Activar BusVideos
</button>

<script>
    const btnActivar = document.getElementById("btnActivar");

    btnActivar.addEventListener("click", () => {
    if (!bus) return;

    // Abrir la app directamente en modo activación
    window.location.href = `busvideos://open?modo=activar&bus=${bus}`;
    });
</script>

<p class="note">
    Android requerido<br>
    iPhone: accede desde el navegador
</p>

<script>
    // ===============================
    // COMPORTAMIENTO SEGÚN from=app
    // ===============================
    const subtitle = document.getElementById("subtitle");

    if (fromApp) {
        // Retorno desde la app
        subtitle.innerText = "Pulse Activar BusVideos para continuar";
    } else {
        // Primer escaneo
        subtitle.innerText = "Instale la app y luego pulse Abrir BusVideos";
    }
</script>

</body>
</html>
