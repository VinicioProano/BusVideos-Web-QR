<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BusVideos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 24px;
            background-color: #ffffff;
        }
        h1 {
            font-size: 28px;
        }
        p {
            font-size: 16px;
        }
        .btn {
            display: block;
            margin: 16px auto;
            padding: 14px;
            width: 100%;
            max-width: 320px;
            font-size: 18px;
            color: white;
            background-color: #1a73e8;
            border: none;
            border-radius: 6px;
            text-decoration: none;
        }
        .secondary {
            background-color: #4caf50;
        }
        .note {
            font-size: 14px;
            color: #555;
            margin-top: 24px;
        }
    </style>
</head>
<body>

<script>
    // --- VALIDACIÓN DE QR ---
    const params = new URLSearchParams(window.location.search);
    const bus = params.get("bus");

    // Si no viene bus, no renderiza nada
    if (!bus) {
        document.body.innerHTML = "";
        throw new Error("QR sin parámetro bus");
    }

    // URL HTTP DE PRUEBA (temporal)
    const INSTALL_URL_TEST = "https://busvideos.github.io/BusVideos-Web-QR/?bus=BV-CCC-001";
</script>

<h1>🎬 BusVideos</h1>

<p>Entretenimiento a bordo</p>

<!-- BOTÓN ABRIR / ACTIVAR APP (SIEMPRE VISIBLE) -->
<a class="btn" href="busvideos://open">
    ▶ Abrir BusVideos
</a>

<!-- BOTÓN INSTALAR APP (SIEMPRE VISIBLE) -->
<a class="btn secondary" id="btnInstalar">
    ⬇ Instalar BusVideos
</a>

<p class="note">
    Android requerido<br>
    iPhone: accede desde el navegador
</p>

<script>
    // Acción del botón Instalar (usa HTTP de prueba)
    document.getElementById("btnInstalar").addEventListener("click", () => {
        window.location.href = INSTALL_URL_TEST;
    });
</script>

</body>
</html>
