<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BusVideos</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 24px;
            margin: 0;
            background-color: #ffffff;
        }

        .contenedor {
            width: 100%;
            max-width: 380px;
            margin: 0 auto;
            padding-top: 35px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 6px;
            color: #1565C0;
        }

        .subtitulo {
            font-size: 16px;
            color: #263238;
            margin-top: 0;
            margin-bottom: 30px;
        }

        .btn {
            display: block;
            box-sizing: border-box;

            width: 100%;
            max-width: 320px;

            margin: 14px auto;
            padding: 14px;

            border: none;
            border-radius: 8px;

            font-size: 16px;
            font-weight: bold;

            color: white;

            cursor: pointer;
        }

        /* INSTALAR SERVIZONA */

        .instalar {
            background-color: #43A047;
        }

        /* INGRESAR A BUSVIDEOS */

        .ingresar {
            background-color: #1565C0;
        }

        /* ACTIVAR / REACTIVAR / REINSTALAR */

        .activar {
            background-color: #FB8C00;
        }

        .estado {
            font-size: 15px;
            font-weight: bold;
            color: #263238;
            margin-top: 25px;
        }

        .mensaje {
            font-size: 14px;
            color: #607D8B;
            margin-top: 14px;
            line-height: 1.5;
        }

        .bus-info {
            font-size: 13px;
            color: #607D8B;
            margin-top: 28px;
        }

        .oculto {
            display: none;
        }

    </style>

</head>


<body>


<div class="contenedor">


    <h1>🎬 BusVideos</h1>


    <p class="subtitulo">
        Entretenimiento a bordo
    </p>


    <!-- ========================================= -->
    <!-- BOTÓN 1 - INSTALAR SERVIZONA             -->
    <!-- ========================================= -->

    <button
        id="btnInstalar"
        class="btn instalar"
        type="button"
    >
        ⬇ Instalar ServiZona
    </button>


    <!-- ========================================= -->
    <!-- BOTÓN 2 - INGRESAR A BUSVIDEOS           -->
    <!-- SOLO ESTADO ACTIVO                       -->
    <!-- ========================================= -->

    <button
        id="btnIngresar"
        class="btn ingresar oculto"
        type="button"
    >
        ▶ Ingresar a BusVideos
    </button>


    <!-- ========================================= -->
    <!-- BOTÓN 3 - ACTIVACIÓN DEL SERVICIO         -->
    <!-- ========================================= -->

    <button
        id="btnActivar"
        class="btn activar oculto"
        type="button"
    >
        Activar servicio
    </button>


    <!-- ========================================= -->
    <!-- INFORMACIÓN DEL ESTADO                    -->
    <!-- ========================================= -->

    <p
        id="estadoServicio"
        class="estado"
    >
        Consultando servicio...
    </p>


    <p
        id="mensaje"
        class="mensaje"
    >
    </p>


    <!-- ========================================= -->
    <!-- CÓDIGO DEL BUS                            -->
    <!-- Lo dejamos visible durante las pruebas    -->
    <!-- ========================================= -->

    <p
        id="busInfo"
        class="bus-info"
    >
    </p>


</div>


<script>


// =====================================================
// BUSVIDEOS + SERVIZONA
// PÁGINA PERMANENTE DEL QR
// =====================================================


// =====================================================
// 1. LEER PARÁMETROS
// =====================================================

const params =
    new URLSearchParams(window.location.search);

let bus =
    params.get("bus");


// =====================================================
// 2. ELEMENTOS DE LA PÁGINA
// =====================================================

const btnInstalar =
    document.getElementById("btnInstalar");

const btnIngresar =
    document.getElementById("btnIngresar");

const btnActivar =
    document.getElementById("btnActivar");

const estadoServicio =
    document.getElementById("estadoServicio");

const mensaje =
    document.getElementById("mensaje");

const busInfo =
    document.getElementById("busInfo");


// =====================================================
// 3. GUARDAR / RECUPERAR CÓDIGO DEL BUS
// =====================================================

if (bus && bus.trim() !== "") {

    localStorage.setItem(
        "BUSVIDEOS_BUS",
        bus
    );

} else {

    bus =
        localStorage.getItem(
            "BUSVIDEOS_BUS"
        );
}


// =====================================================
// 4. MOSTRAR CÓDIGO DEL BUS
// =====================================================

if (bus) {

    busInfo.innerText =
        "Código de bus detectado: " + bus;

} else {

    busInfo.innerText =
        "⚠️ Código de bus no detectado.";
}


// =====================================================
// 5. INSTALAR SERVIZONA
// =====================================================
//
// TODAVÍA NO CONECTAMOS LA APK.
//
// Cuando ServiZona esté completamente terminada,
// este botón descargará la APK definitiva.
// =====================================================

btnInstalar.addEventListener(
    "click",
    function() {

        alert(
            "La instalación de ServiZona se habilitará al finalizar las pruebas."
        );
    }
);


// =====================================================
// 6. INGRESAR A BUSVIDEOS
// =====================================================
//
// POR AHORA NO ABRIMOS SERVIZONA.
//
// En el siguiente paso conectaremos este botón
// con ServiZona y enviaremos el código del bus.
// =====================================================

btnIngresar.addEventListener(
    "click",
    function() {

        if (!bus) {

            alert(
                "No se detectó el código del bus."
            );

            return;
        }

        alert(
            "BusVideos activo.\n\n" +
            "Código de bus: " + bus + "\n\n" +
            "En el siguiente paso conectaremos este botón con ServiZona."
        );
    }
);


// =====================================================
// 7. ACTIVAR / REACTIVAR / REINSTALAR
// =====================================================
//
// TODAVÍA NO ABRIMOS EL FLUJO DE ACTIVACIÓN.
// Primero verificaremos que los estados funcionen.
// =====================================================

btnActivar.addEventListener(
    "click",
    function() {

        if (!bus) {

            alert(
                "No se detectó el código del bus."
            );

            return;
        }

        alert(
            "Flujo de activación preparado.\n\n" +
            "Código de bus: " + bus
        );
    }
);


// =====================================================
// 8. MOSTRAR ESTADO
// =====================================================

function mostrarEstado(estado) {

    // Ocultar primero botones variables

    btnIngresar.classList.add("oculto");

    btnActivar.classList.add("oculto");


    // Normalizar estado

    const estadoNormalizado =
        (estado || "")
        .trim()
        .toUpperCase();


    // =================================================
    // ACTIVO
    // =================================================

    if (estadoNormalizado === "ACTIVO") {

        estadoServicio.innerText =
            "Servicio ACTIVO";

        mensaje.innerText =
            "BusVideos está disponible en esta unidad.";

        btnIngresar.classList.remove(
            "oculto"
        );

        return;
    }


    // =================================================
    // SUSPENDIDO
    // =================================================

    if (estadoNormalizado === "SUSPENDIDO") {

        estadoServicio.innerText =
            "Servicio SUSPENDIDO";

        mensaje.innerText =
            "El servicio BusVideos se encuentra suspendido.";

        btnActivar.innerText =
            "🔄 Reactivar servicio";

        btnActivar.classList.remove(
            "oculto"
        );

        return;
    }


    // =================================================
    // INACTIVO
    // =================================================

    if (estadoNormalizado === "INACTIVO") {

        estadoServicio.innerText =
            "Servicio INACTIVO";

        mensaje.innerText =
            "Este servicio requiere reinstalación.";

        btnActivar.innerText =
            "🔧 Reinstalar servicio";

        btnActivar.classList.remove(
            "oculto"
        );

        return;
    }


    // =================================================
    // NO ACTIVADO
    // =================================================

    if (
        estadoNormalizado === "NO ACTIVADO" ||
        estadoNormalizado === "NO_ACTIVADO" ||
        estadoNormalizado === "NOT_ACTIVATED"
    ) {

        estadoServicio.innerText =
            "Servicio NO ACTIVADO";

        mensaje.innerText =
            "BusVideos todavía no ha sido activado en esta unidad.";

        btnActivar.innerText =
            "▶ Activar servicio";

        btnActivar.classList.remove(
            "oculto"
        );

        return;
    }


    // =================================================
    // ESTADO DESCONOCIDO
    // =================================================

    estadoServicio.innerText =
        "Servicio no disponible";

    mensaje.innerText =
        "No se pudo determinar el estado actual de BusVideos.";
}


// =====================================================
// 9. CONSULTAR ESTADO AUTOMÁTICAMENTE
// =====================================================

function consultarEstadoServicio() {

    if (!bus) {

        estadoServicio.innerText =
            "Código de bus no detectado";

        mensaje.innerText =
            "Escanee nuevamente el código QR ubicado en el bus.";

        return;
    }


    estadoServicio.innerText =
        "Consultando servicio...";


    fetch(
        "https://script.google.com/macros/s/" +
        "AKfycbxs-VQga-j7HP48kS8uqX3_Rrq2P39VP-ikoS5NKl250blR8kGn69Mj10530vknJgRd" +
        "/exec?action=consultarEstadoServicio" +
        "&codigo_bus=" +
        encodeURIComponent(bus)
    )

    .then(
        response => response.json()
    )

    .then(
        data => {

            if (!data.ok) {

                estadoServicio.innerText =
                    "Servicio no disponible";

                mensaje.innerText =
                    data.error ||
                    "No se pudo consultar el estado del servicio.";

                return;
            }


            mostrarEstado(
                data.estado
            );
        }
    )

    .catch(
        error => {

            console.error(error);

            estadoServicio.innerText =
                "Sin conexión";

            mensaje.innerText =
                "No se pudo consultar el servicio. Intente nuevamente.";
        }
    );
}


// =====================================================
// 10. INICIAR
// =====================================================

consultarEstadoServicio();


</script>


</body>

</html>
