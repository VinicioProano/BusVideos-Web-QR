<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BusVideos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 24px;
            background-color: #ffffff;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        p {
            font-size: 16px;
            margin: 8px 0;
        }

        .btn {
    display: flex;
    align-items: center;
    justify-content: center;

    margin: 16px auto;
    height: 52px;              /* 🔑 MISMA ALTURA */
    width: 100%;
    max-width: 320px;

    font-size: 18px;
    font-weight: 500;

    color: #ffffff;
    background-color: #1a73e8;

    border: none;
    border-radius: 8px;
    text-decoration: none;
    cursor: pointer;
}

.secondary {
    background-color: #4caf50;
}

        .note {
            font-size: 14px;
            color: #555;
            margin-top: 24px;
        }

        #busInfo {
            margin-top: 12px;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>

<body>

<script>
    // ===============================
    // VALIDACIÓN DE QR
    // ===============================
    const params = new URLSearchParams(window.location.search);
    const bus = params.get("bus");
    const fromApp = params.get("from") === "app";
</script>

<h1>🎬 BusVideos</h1>

<p id="subtitle">Entretenimiento a bordo</p>

<!-- MOSTRAR CÓDIGO DE BUS (SOLO PRUEBAS) -->
<p id="busInfo"></p>

<!-- BOTÓN INSTALAR -->
<a
    class="btn secondary"
    href="https://raw.githubusercontent.com/VinicioProano/BusVideos-Web-QR/master/BusVideos.apk"
    download
>
    ⬇ Instalar BusVideos
</a>

<!-- BOTÓN ACTIVAR -->
<button id="btnActivar" class="btn" type="button">
    ▶ Activar BusVideos
</button>

<p class="note">
    Android requerido<br>
    iPhone: accede desde el navegador
</p>

<script>
    // ===============================
    // MOSTRAR CÓDIGO BUS (PRUEBAS)
    // ===============================
    const busInfo = document.getElementById("busInfo");

    if (bus) {
        busInfo.innerText = "Código de bus detectado: " + bus;
    } else {
        busInfo.innerText = "⚠️ No llegó parámetro ?bus= en la URL";
    }

    // ===============================
    // TEXTO DINÁMICO
    // ===============================
    const subtitle = document.getElementById("subtitle");

    subtitle.innerText = fromApp
        ? "Pulse Activar BusVideos para continuar"
        : "Instale la app y luego pulse Activar BusVideos";

    // ===============================
    // ACCIÓN BOTÓN ACTIVAR
    // ===============================
    document.getElementById("btnActivar").addEventListener("click", () => {
        if (!bus) {
            alert("No se detectó el código del bus.");
            return;
        }

        // Abrir la app en modo activación
        window.location.href = `busvideos://open?modo=activar&bus=${bus}`;
    });
</script>

</body>
</html>
