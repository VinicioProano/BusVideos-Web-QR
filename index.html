<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BusVideos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 24px;
            background-color: #ffffff;
        }
        .btn {
            display: block;
            margin: 16px auto;
            padding: 14px;
            width: 100%;
            max-width: 320px;
            font-size: 18px;
            color: white;
            background-color: #1a73e8;
            border: none;
            border-radius: 6px;
        }
        .secondary {
            background-color: #4caf50;
        }
        .note {
            font-size: 14px;
            color: #555;
            margin-top: 24px;
        }
    </style>
</head>

<body>

<script>
    // ===============================
    // VALIDACIÓN DE QR
    // ===============================
    const params = new URLSearchParams(window.location.search);
    const bus = params.get("bus");
    const fromApp = params.get("from") === "app";

    if (!bus) {
        document.body.innerHTML = "";
        return;
    }
</script>

<h1>🎬 BusVideos</h1>

<p id="subtitle">Entretenimiento a bordo</p>

<!-- MOSTRAR BUS (SOLO PRUEBAS) -->
<p id="busInfo" style="margin-top:12px; font-size:14px; color:#555;"></p>

<!-- BOTÓN INSTALAR -->
<a class="btn secondary"
   href="https://raw.githubusercontent.com/VinicioProano/BusVideos-Web-QR/master/BusVideos.apk"
   download>
   ⬇ Instalar BusVideos
</a>

<!-- BOTÓN ACTIVAR -->
<button id="btnActivar" class="btn" type="button">
    ▶ Activar BusVideos
</button>

<p class="note">
    Android requerido<br>
    iPhone: accede desde el navegador
</p>

<script>
    // Mostrar código del bus
    document.getElementById("busInfo").innerText =
        "Código de bus detectado: " + bus;

    // Texto dinámico
    const subtitle = document.getElementById("subtitle");
    subtitle.innerText = fromApp
        ? "Pulse Activar BusVideos para continuar"
        : "Instale la app y luego pulse Abrir BusVideos";

    // Acción Activar
    document.getElementById("btnActivar").addEventListener("click", () => {
        window.location.href = `busvideos://open?modo=activar&bus=${bus}`;
    });
</script>

</body>
</html>
