<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BusVideos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 24px;
            background-color: #ffffff;
        }
        h1 {
            font-size: 16px;
        }
        p {
            font-size: 24px;
        }
        .btn {
            display: block;
            margin: 16px auto;
            padding: 14px;
            width: 100%;
            max-width: 320px;
            font-size: 18px;
            color: white;
            background-color: #1a73e8;
            border: none;
            border-radius: 6px;
            text-decoration: none;
        }
        .secondary {
            background-color: #4caf50;
        }
        .note {
            font-size: 14px;
            color: #555;
            margin-top: 24px;
        }
    </style>
</head>
<body>

<script>
    // ===============================
    // VALIDACIÓN DE QR
    // ===============================
    const params = new URLSearchParams(window.location.search);
    const bus = params.get("bus");
    const fromApp = params.get("from") === "app";

    // Si no viene bus, no se muestra nada
    if (!bus) {
        document.body.innerHTML = "";
        return;
    }
</script>

<h1>🎬 BusVideos</h1>

<p id="subtitle">Entretenimiento a bordo</p>

<!-- BOTÓN INSTALAR APP (SIEMPRE VISIBLE, SIN ACCIÓN REAL AÚN) -->
<a class="btn secondary" href="#">
    ⬇ Instalar BusVideos
</a>

<!-- BOTÓN ACTIVAR APP (SIEMPRE VISIBLE) -->
<button class="btn" type="button">
    ▶ Activar BusVideos
</button>

<p class="note">
    Android requerido<br>
    iPhone: accede desde el navegador
</p>

<script>
    // ===============================
    // COMPORTAMIENTO SEGÚN from=app
    // ===============================
    const subtitle = document.getElementById("subtitle");

    if (fromApp) {
        // Retorno desde la app
        subtitle.innerText = "Pulse Activar BusVideos para continuar";
    } else {
        // Primer escaneo
        subtitle.innerText = "Instale la app y luego pulse Abrir BusVideos";
    }
</script>

</body>
</html>
