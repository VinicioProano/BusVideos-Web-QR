<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BusVideos</title>

<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 24px;
        background-color: #ffffff;
    }

    h1 {
        font-size: 28px;
    }

    .btn {
        display: block;
        margin: 16px auto;
        padding: 14px;
        width: 90%;
        max-width: 320px;
        border-radius: 8px;
        font-size: 16px;
        text-decoration: none;
        border: none;
        cursor: pointer;
    }

    .secondary {
        background-color: #4CAF50;
        color: white;
    }

    .primary {
        background-color: #1976D2;
        color: white;
    }

    .note {
        font-size: 13px;
        color: #666;
        margin-top: 20px;
    }
</style>
</head>
<body>

<h1>🎬 BusVideos</h1>

<p id="subtitle">Instale la app y luego pulse Activar BusVideos</p>

<p id="busInfo"></p>

<!-- BOTÓN INSTALAR -->
<a
    id="btnInstalar"
    class="btn secondary"
    href="https://raw.githubusercontent.com/VinicioProano/BusVideos-Web-QR/master/BusVideos.apk"
    download
>
    ⬇ Instalar BusVideos
</a>

<!-- BOTÓN ACTIVAR -->
<button id="btnActivar" class="btn primary" type="button">
    ▶ Activar BusVideos
</button>

<p class="note">
    Android requerido<br>
    iPhone: accede desde el navegador
</p>

<script>
    // ===============================
    // PARÁMETROS
    // ===============================
    const params = new URLSearchParams(window.location.search);

    let bus = params.get("bus");
    const fromApp = params.get("from") === "app";

    // ===============================
    // GUARDAR / RECUPERAR BUS
    // ===============================
    if (bus && bus.trim() !== "") {
        localStorage.setItem("BUSVIDEOS_BUS", bus);
    } else {
        bus = localStorage.getItem("BUSVIDEOS_BUS");
    }

    // ===============================
    // MOSTRAR CÓDIGO BUS
    // ===============================
    const busInfo = document.getElementById("busInfo");

    if (bus) {
        busInfo.innerText = "Código de bus detectado: " + bus;
    } else {
        busInfo.innerText = "⚠️ No llegó parámetro ?bus= en la URL";
    }

    // ===============================
    // TEXTO DINÁMICO
    // ===============================
    const subtitle = document.getElementById("subtitle");

    subtitle.innerText = fromApp
        ? "Pulse Activar BusVideos para continuar"
        : "Instale la app y luego pulse Activar BusVideos";

    // ===============================
    // BOTÓN ACTIVAR
    // ===============================
    document.getElementById("btnActivar").addEventListener("click", () => {
        if (!bus) {
            alert("No se detectó el código del bus.");
            return;
        }

        window.location.href = `busvideos://open?modo=activar&bus=${bus}`;
    });

    // ===============================
// AUTO ABRIR APP SI ESTÁ INSTALADA
// ===============================
if (bus && !fromApp && !params.get("installed")) {

    // Intentamos abrir la app
    const deepLink = `busvideos://open?bus=${bus}`;

    // Pequeño delay para que cargue la página primero
    setTimeout(() => {
        window.location.href = deepLink;
    }, 500);
}
</script>

</body>
</html>
